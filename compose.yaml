services:
    mysql:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:-sr_gastos}'
            MYSQL_USER: '${MYSQL_APP_USER:-sr_gastos}'
            MYSQL_PASSWORD: '${MYSQL_APP_PASSWORD:-secret}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-root}'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent',
                ]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    mysql-data:
